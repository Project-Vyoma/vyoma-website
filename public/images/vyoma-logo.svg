<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for the trail from dark gray to light blue/teal -->
    <linearGradient id="trailGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#666666;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4FC3F7;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#4FC3F7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- VYOM text in white, bold, modern sans-serif -->
  <text x="8" y="38" font-family="'Arial', 'Helvetica', sans-serif" font-size="32" font-weight="bold" fill="white" letter-spacing="1.5">VYOM</text>
  
  <!-- Curved trail line starting from below the O, transitioning from dark gray to light blue -->
  <path d="M 88 42 Q 95 32, 102 28 Q 110 24, 118 26 Q 125 28, 132 25" 
        stroke="url(#trailGradient)" 
        stroke-width="2.5" 
        fill="none" 
        stroke-linecap="round"/>
  
  <!-- Stylized A - left part in white -->
  <text x="138" y="38" font-family="'Arial', 'Helvetica', sans-serif" font-size="32" font-weight="bold" fill="white" letter-spacing="1.5">A</text>
  
  <!-- Right leg of A as curved light blue/teal line that continues the motion -->
  <path d="M 160 38 Q 165 30, 170 25 Q 175 20, 180 18" 
        stroke="#4FC3F7" 
        stroke-width="3" 
        fill="none" 
        stroke-linecap="round"/>
  
  <!-- Paper airplane/rocket graphic in light blue/teal -->
  <g transform="translate(185, 15)">
    <!-- Trail behind the airplane -->
    <path d="M -5 8 Q -2 4, 0 0" 
          stroke="#4FC3F7" 
          stroke-width="2" 
          fill="none" 
          opacity="0.6" 
          stroke-linecap="round"/>
    
    <!-- Main body of the airplane (triangle pointing up-right) -->
    <path d="M 0 0 L 10 8 L 6 12 L 0 0 Z" 
          fill="#4FC3F7"/>
    
    <!-- Top wing -->
    <path d="M 3 5 L 7 3 L 5 7 L 3 5 Z" 
          fill="#4FC3F7" 
          opacity="0.9"/>
    
    <!-- Bottom wing -->
    <path d="M 3 9 L 7 11 L 5 13 L 3 9 Z" 
          fill="#4FC3F7" 
          opacity="0.9"/>
  </g>
</svg>
